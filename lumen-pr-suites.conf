# lumen-pr-suites.conf — repos whose full test suite must PASS before `lumen-pr land` (wq#5133).
#
# Format: <owner/repo> <command run from the repo root of <PR head merged onto origin/main>>
# Gate: the command's exit status must be 0 (pytest: zero failures, zero errors; skips are fine).
# Run under lumen-run by `lumen-pr suite` (or started automatically by the first `land`).
# A repo with no line here is not gated. Changing this file is a reviewed lumen-bin PR.
#
# claude-foreman: harness suite, ~20 min, green since wq#5030 (b065f315). 7 mask_replay pin
# skips are expected. -p no:cacheprovider keeps runs from writing .pytest_cache into the tree.
lumen/claude-foreman python3 -m pytest harness/tests -q -p no:cacheprovider
